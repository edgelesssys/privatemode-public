replicaCount: 1
fullnameOverride: ''
runtimeClassName: ''
podAnnotations: {}
initContainers: []
image:
  image: ghcr.io/edgelesssys/privatemode/privatemode-proxy:v1.58.1-pre
  pullPolicy: IfNotPresent
  restartPolicy: Always
service:
  type: ClusterIP
  port: 8080
  annotations: {}
ingress:
  enabled: false
  className: ''
  annotations: {}
  # hosts:
  #   - host: privatemode-proxy.example.com
  hosts: []
  # tls:
  #   - hosts:
  #       - privatemode-proxy.example.com
  #     secretName: privatemode-proxy-ingress-tls
  tls: []
probes:
  startup:
    failureThreshold: 30
    initialDelaySeconds: 5
    periodSeconds: 5
    successThreshold: 1
  readiness:
    failureThreshold: 3
    periodSeconds: 30
    successThreshold: 1
resources: {}
nodeSelector:
  kubernetes.io/arch: amd64
tolerations: []
affinity: {}
# Command-line options for the privatemode-proxy
config:
  # API key configuration
  apiKey:
    enabled: true
    # Name of the Kubernetes Secret containing the API key under the key "apiKey".
    apiKeySecretName: 'privatemode-api-key'
    # When to use the configured key for forwarded requests: never, always, or if-placeholder.
    # Leave empty to use the proxy's default.
    fallback: ''
  # API configuration
  apiEndpoint:
    enabled: false
    apiEndpoint: 'api.privatemode.ai:443'
  # Container port configuration
  port: '8080'
  # Exact browser origins; empty disables CORS. Use ['*'] to allow any origin.
  corsAllowedOrigins: []
  workspace:
    enabled: false
    volumeClaimName: 'privatemode-proxy-pvc'
    mountPath: '/workspace'
  # Manifest file configuration
  manifest:
    enabled: false # not recommended to be enabled
    configMapName: 'privatemode-proxy-config'
    fileName: 'manifest.toml'
    mountPath: '/etc/config/manifest.toml'
  # TLS configuration
  tls:
    enabled: false
    secretName: 'privatemode-proxy-tls'
  # Custom CA bundle for outbound TLS inspection / MitM appliances
  customCA:
    enabled: false
    # Name of the Kubernetes Secret containing the bundle under the key fileName.
    secretName: 'privatemode-proxy-custom-ca'
    # Name of a ConfigMap containing the bundle under the key fileName; takes precedence over secretName.
    configMapName: ''
    fileName: 'ca-bundle.crt'
  sharedPromptCache:
    enabled: false
    # Salt source passed to --prompt-cache-salt when sharing is enabled.
    # Ignored when a salt Secret is configured below.
    saltSource: 'random'
    promptCacheSalt:
      enabled: false
      # Name of the Kubernetes Secret containing a random string of at least 32 bytes
      # under the key "promptCacheSalt".
      secretName: 'privatemode-proxy-prompt-cache-salt'
  # Set to true to allow the proxy to accept self-signed certificates from the backend
  insecureAPIConnection: false
  # Extra command-line arguments
  extraArgs: []
  # Extra environment variables
  extraEnv: []
  # Extra volumes and mounts for the proxy container
  extraVolumes: []
  extraVolumeMounts: []
