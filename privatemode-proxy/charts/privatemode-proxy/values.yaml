replicaCount: 1
image:
  image: ghcr.io/edgelesssys/privatemode/privatemode-proxy:v1.49.1-pre
  pullPolicy: IfNotPresent
  restartPolicy: Always
service:
  type: ClusterIP
  port: 8080
  annotations: {}
probes:
  startup:
    failureThreshold: 30
    initialDelaySeconds: 5
    periodSeconds: 5
    successThreshold: 1
  readiness:
    failureThreshold: 3
    periodSeconds: 30
    successThreshold: 1
resources: {}
nodeSelector:
  kubernetes.io/arch: amd64
tolerations: []
affinity: {}
# Command-line options for the privatemode-proxy
config:
  # API key configuration
  apiKey:
    enabled: true
    apiKeySecretName: 'privatemode-api-key' # Name of the Kubernetes Secret containing the API
  # API configuration
  apiEndpoint:
    enabled: false
    apiEndpoint: 'api.privatemode.ai:443'
  # Container port configuration
  port: '8080'
  workspace:
    enabled: false
    volumeClaimName: 'privatemode-proxy-pvc'
    mountPath: '/workspace'
  # Manifest file configuration
  manifest:
    enabled: false # not recommended to be enabled
    configMapName: 'privatemode-proxy-config'
    fileName: 'manifest.toml'
    mountPath: '/etc/config/manifest.toml'
  # TLS configuration
  tls:
    enabled: false
    secretName: 'privatemode-proxy-tls'
  # Custom CA bundle for outbound TLS inspection / MitM appliances
  customCA:
    enabled: false
    secretName: 'privatemode-proxy-custom-ca'
    fileName: 'ca-bundle.crt'
  sharedPromptCache:
    enabled: false
  # Extra environment variables
  extraEnv: []
  # Set to true to allow the proxy to accept self-signed certificates from the backend
  insecureAPIConnection: false
