apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "privatemode-proxy.fullname" . }}
  labels:
    {{- include "privatemode-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "privatemode-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "privatemode-proxy.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      restartPolicy: {{ .Values.image.restartPolicy }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.image }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          startupProbe:
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            successThreshold: {{ .Values.probes.startup.successThreshold }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            httpGet:
              path: /readyz
              port: http
              scheme: {{ ternary "HTTPS" "HTTP" .Values.config.tls.enabled }}
          readinessProbe:
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            httpGet:
              path: /readyz
              port: http
              scheme: {{ ternary "HTTPS" "HTTP" .Values.config.tls.enabled }}
          args:
            {{- if .Values.config.apiKey.enabled }}
            - "--api-key=@/etc/apiKey/apiKey"
            {{- end}}
            {{- with .Values.config.apiKey.fallback }}
            - {{ printf "--api-key-fallback=%s" . | quote }}
            {{- end }}
            {{- if .Values.config.apiEndpoint.enabled }}
            - "--api-endpoint={{ .Values.config.apiEndpoint.apiEndpoint }}"
            {{- end}}
            - "--port={{ .Values.config.port }}"
            {{- range .Values.config.corsAllowedOrigins }}
            - {{ printf "--cors-allowed-origins=%s" . | quote }}
            {{- end }}
            {{- if .Values.config.workspace.enabled }}
            - "--workspace={{ .Values.config.workspace.mountPath }}"
            {{- end }}
            {{- if .Values.config.manifest.enabled }}
            - "--manifest-path={{ .Values.config.manifest.mountPath }}"
            {{- end }}
            {{- if .Values.config.tls.enabled }}
            - "--tls-cert-path=/etc/tls/tls.crt"
            - "--tls-key-path=/etc/tls/tls.key"
            {{- end }}
            {{- if .Values.config.insecureAPIConnection }}
            - "--insecure-api-connection=true"
            {{- end }}
            {{- if .Values.config.sharedPromptCache.enabled }}
            - "--disable-prompt-cache=false"
            {{- if .Values.config.sharedPromptCache.promptCacheSalt.enabled }}
            - "--prompt-cache-salt=@/etc/promptCacheSalt/promptCacheSalt"
            {{- else }}
            - {{ printf "--prompt-cache-salt=%s" .Values.config.sharedPromptCache.saltSource | quote }}
            {{- end }}
            {{- else }}
            {{- if .Values.config.sharedPromptCache.promptCacheSalt.enabled }}
            {{- fail "config.sharedPromptCache.promptCacheSalt.enabled requires config.sharedPromptCache.enabled" }}
            {{- end }}
            - "--disable-prompt-cache=true"
            {{- end }}
            {{- with .Values.config.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.config.customCA.enabled .Values.config.extraEnv }}
          env:
            {{- if .Values.config.customCA.enabled }}
            - name: SSL_CERT_FILE
              value: "/etc/ssl/certs/custom-ca-bundle.crt"
            {{- end }}
            {{- with .Values.config.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            {{- if .Values.config.workspace.enabled }}
            - name: workspace
              mountPath: {{ .Values.config.workspace.mountPath }}
            {{- end }}
            {{- if .Values.config.manifest.enabled }}
            - name: manifest-config
              mountPath: {{ .Values.config.manifest.mountPath }}
              subPath: {{ .Values.config.manifest.fileName }}
              readOnly: true
            {{- end }}
            {{- if .Values.config.tls.enabled }}
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            {{- end }}
            {{- if .Values.config.apiKey.enabled }}
            - name: apikey
              mountPath: /etc/apiKey
              readOnly: true
            {{- end }}
            {{- if .Values.config.sharedPromptCache.promptCacheSalt.enabled }}
            - name: promptcachesalt
              mountPath: /etc/promptCacheSalt
              readOnly: true
            {{- end }}
            {{- if .Values.config.customCA.enabled }}
            - name: custom-ca
              mountPath: /etc/ssl/certs/custom-ca-bundle.crt
              subPath: {{ .Values.config.customCA.fileName }}
              readOnly: true
            {{- end }}
            {{- with .Values.config.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.config.workspace.enabled }}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ .Values.config.workspace.volumeClaimName }}
        {{- end }}
        {{- if .Values.config.manifest.enabled }}
        - name: manifest-config
          configMap:
            name: {{ .Values.config.manifest.configMapName }}
        {{- end }}
        {{- if .Values.config.tls.enabled }}
        - name: tls-certs
          secret:
            secretName: {{ .Values.config.tls.secretName }}
        {{- end }}
        {{- if .Values.config.apiKey.enabled }}
        - name: apikey
          secret:
            secretName: {{ .Values.config.apiKey.apiKeySecretName }}
        {{- end }}
        {{- if .Values.config.sharedPromptCache.promptCacheSalt.enabled }}
        - name: promptcachesalt
          secret:
            secretName: {{ .Values.config.sharedPromptCache.promptCacheSalt.secretName }}
        {{- end }}
        {{- if .Values.config.customCA.enabled }}
        - name: custom-ca
          {{- if .Values.config.customCA.configMapName }}
          configMap:
            name: {{ .Values.config.customCA.configMapName }}
          {{- else }}
          secret:
            secretName: {{ required "config.customCA.enabled requires config.customCA.secretName or config.customCA.configMapName" .Values.config.customCA.secretName }}
          {{- end }}
        {{- end }}
        {{- with .Values.config.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
