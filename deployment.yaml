apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: secret-service
  namespace: continuum-551e7c
  labels:
    app.kubernetes.io/instance: '551e7c'
spec:
  replicas: 3
  serviceName: secret-service-headless
  selector:
    matchLabels:
      app: secret-service
  template:
    metadata:
      labels:
        app: secret-service
        app.kubernetes.io/instance: '551e7c'
        privatemode.edgeless.systems/environment: 'production'
        privatemode.edgeless.systems/delete-when: coordinator-recovered
    spec:
      runtimeClassName: contrast-cc
      containers:
        - name: secret-service
          image: 'ghcr.io/edgelesssys/privatemode/secret-service:v1.60.0@sha256:ab870296a6fd6e76a3d55b0c1b7691e3766a984bcfa793b01fae4114d2488bda'
          resources:
            requests:
              memory: 2Gi
            limits:
              memory: 2Gi
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec /bin/secret-service \
                --k8s-namespace=continuum-551e7c \
                $([ "${HOSTNAME##*-}" = "0" ] && echo "--may-bootstrap") \
                --etcd-server-cert=/contrast/tls-config/certChain.pem \
                --etcd-server-key=/contrast/tls-config/key.pem \
                --etcd-ca=/contrast/tls-config/mesh-ca.pem \
                --identity-cert-path=/var/run/secrets/identity/tls.crt \
                --identity-key-path=/var/run/secrets/identity/tls.key \
                --identity-ca-path=/var/run/secrets/identity/ca.crt
          ports:
            - containerPort: 3000
            - containerPort: 9000
            - containerPort: 2379
            - containerPort: 2380
            - containerPort: 8080
          volumeMounts:
            - name: identity
              mountPath: /var/run/secrets/identity
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 240
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: identity
          secret:
            secretName: secret-service-identity-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-deepseek-ocr-2
  namespace: continuum-551e7c
  labels:
    app: workload-deepseek-ocr-2
    app.kubernetes.io/instance: '551e7c'
spec:
  selector:
    matchLabels:
      app: workload-deepseek-ocr-2
  template:
    metadata:
      labels:
        app: workload-deepseek-ocr-2
        app.kubernetes.io/instance: '551e7c'
        privatemode.edgeless.systems/environment: 'production'
        privatemode.edgeless.systems/delete-when: coordinator-recovered
        privatemode.edgeless.systems/workload: ""
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/scheme: "http"
    spec:
      serviceAccountName: workload-deepseek-ocr-2-sa
      runtimeClassName: contrast-cc-metal-qemu-snp-gpu
      initContainers:
        - name: kernel-log
          image: ghcr.io/edgelesssys/privatemode/kernel-log:v1.60.0@sha256:b94e4578ebb5921572df523d05670438896505d642f6a4850cfbebc4ce4a8036
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - MKNOD
        - name: attestation-agent
          volumeMounts:
            - name: privatemode-identity-ca-cert
              mountPath: /var/run/secrets/identity
              readOnly: true
            - name: continuum-run
              mountPath: /var/run/continuum
            - mountPath: /contrast
              name: contrast-secrets
          image: ghcr.io/edgelesssys/privatemode/attestation-agent:v1.60.0@sha256:d964f8ac74aab6c77ff44d009f0c16325b4439493ea2757bdc481a649b871239
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
          args:
            - --identity-ca-path=/var/run/secrets/identity/ca.crt
            - --rim-url=http://collateral-proxy.continuum-infra.svc/
            - --gpu-driver-versions=610.57.04
            - --gpu-vbios-versions=96.00.88.00.11,96.00.74.00.11,96.00.9F.00.04,96.00.74.00.1C
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - SYS_ADMIN
        - name: disk-mounter-deepseek-ocr-2-0
          image: ghcr.io/edgelesssys/privatemode/disk-mounter:v1.60.0@sha256:99aea95418f72c5d71e4ae60bafe19c38a86acc4ad0abfcc7ac5c477b7538ffd
          args:
            - 'deepseek-ocr-2'
            - '0'
            - '173c5941da5e2d0b625c479e228151a2129bcc5af2bfc89e03ae475c1d047f83'
          restartPolicy: Always
          securityContext:
            privileged: true
          volumeMounts:
            - name: mount-dir
              mountPath: /mnt
              mountPropagation: Bidirectional
          volumeDevices:
            - name: modelweights-deepseek-ocr-2-0
              devicePath: /dev/modelweights-deepseek-ocr-2-0
      containers:
        - name: workload-deepseek-ocr-2-0
          image: docker.io/vllm/vllm-openai:v0.31.0-x86_64-zstd@sha256:017d6959239eec662c0f6b05e1f6bf5a33b69d4b6cd701236e289defbc2c081a
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - CHOWN
                - SETUID
                - SETGID
                - SETPCAP
          readinessProbe:
            httpGet:
              path: /workload-readyz
              port: 8185
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /workload-livez
              port: 8185
              scheme: HTTP
            failureThreshold: 12
            periodSeconds: 5
            timeoutSeconds: 3
          env:
            - name: VLLM_HOST_IP
              value: '127.0.0.1'
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: VLLM_MAX_AUDIO_CLIP_FILESIZE_MB
              value: "50"
            - name: VLLM_MAX_AUDIO_DECODE_DURATION_S
              value: "3600"
            - name: VLLM_MAX_N_SEQUENCES
              value: "8"
            - name: VLLM_ENGINE_READY_TIMEOUT_S
              value: "2400"
            - name: VLLM_MEDIA_URL_ALLOW_REDIRECTS
              value: "0"
            - name: PYTHONPATH
              value: /vllm-workspace
            - name: VLLM_ANTHROPIC_USAGE_STREAM_INTERVAL
              value: "20"
            - name: PRIVATEMODE_STAT_LOGGER_URL
              value: 'http://127.0.0.1:8285/SubmitStatsEvents'
            - name: TRITON_ALLOW_NON_CONSTEXPR_GLOBALS
              value: "1"
            - name: VLLM_USE_V2_MODEL_RUNNER
              value: "0"
            - name: OTEL_SERVICE_NAME
              value: 'vllm-deepseek-ocr-2'
            - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
              value: "true"
            - name: PYTORCH_ALLOC_CONF
              value: "expandable_segments:True"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
          command:
            - /bin/bash
            - -ec
            - |
              # Publish a fresh token for the inference-proxy restart detection.
              cat /proc/sys/kernel/random/uuid > '/var/run/workload-marker/deepseek-ocr-2-0.tmp'
              mv '/var/run/workload-marker/deepseek-ocr-2-0.tmp' '/var/run/workload-marker/deepseek-ocr-2-0'
              mkdir -p /vllm-workspace
              echo "Installing deepseek_logits_processor.py"
              install -D -m 644 /untrusted-vllm-patch/deepseek_logits_processor.py /vllm-workspace/deepseek_logits_processor.py
              if [ $(sha256sum /vllm-workspace/deepseek_logits_processor.py | cut -d ' ' -f 1) != '628ca252446e1fc3ce0a45a66047d105ef3044688d75a4db385054b2e39ea7a0' ]; then echo deepseek_logits_processor.py hash mismatch: $(sha256sum /vllm-workspace/deepseek_logits_processor.py | cut -d ' ' -f 1); exit 1; fi
              echo "Installing privatemode_stat_logger.py"
              install -D -m 644 /untrusted-vllm-patch/privatemode_stat_logger.py /vllm-workspace/privatemode-stat-logger/privatemode_stat_logger.py
              if [ $(sha256sum /vllm-workspace/privatemode-stat-logger/privatemode_stat_logger.py | cut -d ' ' -f 1) != '223a2337d47cf0e86d3e7ad55bbc9ce3cd5e41d10f611814373fe54d397bddc6' ]; then echo privatemode_stat_logger.py hash mismatch: $(sha256sum /vllm-workspace/privatemode-stat-logger/privatemode_stat_logger.py | cut -d ' ' -f 1); exit 1; fi
              echo "Installing privatemode_stat_logger_pyproject.toml"
              install -D -m 644 /untrusted-vllm-patch/privatemode_stat_logger_pyproject.toml /vllm-workspace/privatemode-stat-logger/pyproject.toml
              if [ $(sha256sum /vllm-workspace/privatemode-stat-logger/pyproject.toml | cut -d ' ' -f 1) != '4c1a7b6fbfd6801445b3f9d3cc09953cd9af518ec997a319796a84e7278b6a21' ]; then echo privatemode_stat_logger_pyproject.toml hash mismatch: $(sha256sum /vllm-workspace/privatemode-stat-logger/pyproject.toml | cut -d ' ' -f 1); exit 1; fi
              echo "Installing restrict-vllm-network.py"
              install -D -m 644 /untrusted-vllm-patch/restrict-vllm-network.py /vllm-workspace/restrict-vllm-network.py
              if [ $(sha256sum /vllm-workspace/restrict-vllm-network.py | cut -d ' ' -f 1) != '266a0927ea919db3d1ae35e221cef2ee0701d051f2bbebb3be08fd385a7864a2' ]; then echo restrict-vllm-network.py hash mismatch: $(sha256sum /vllm-workspace/restrict-vllm-network.py | cut -d ' ' -f 1); exit 1; fi
              echo "Installing skip_special_tokens.patch"
              install -D -m 644 /untrusted-vllm-patch/skip_special_tokens.patch /vllm-workspace/skip_special_tokens.patch
              if [ $(sha256sum /vllm-workspace/skip_special_tokens.patch | cut -d ' ' -f 1) != '82e3269ef4ffd41c0670253cf2c37474118ab1615b3dca0a2bf2f2e1be15dbe7' ]; then echo skip_special_tokens.patch hash mismatch: $(sha256sum /vllm-workspace/skip_special_tokens.patch | cut -d ' ' -f 1); exit 1; fi
              patch --batch --fuzz=0 -p1 -d /usr/local/lib/python3.12/dist-packages < /vllm-workspace/skip_special_tokens.patch
              echo "Installing anthropic_usage_stream.patch"
              install -D -m 644 /untrusted-vllm-patch/anthropic_usage_stream.patch /vllm-workspace/anthropic_usage_stream.patch
              if [ $(sha256sum /vllm-workspace/anthropic_usage_stream.patch | cut -d ' ' -f 1) != 'acda26dc6a33351a202777987cf2cef5936cfbbb885b9b79ff36569b705d86d2' ]; then echo anthropic_usage_stream.patch hash mismatch: $(sha256sum /vllm-workspace/anthropic_usage_stream.patch | cut -d ' ' -f 1); exit 1; fi
              patch --batch --fuzz=0 -p1 -d /usr/local/lib/python3.12/dist-packages < /vllm-workspace/anthropic_usage_stream.patch
              echo "Installing dump_input_anonymization.patch"
              install -D -m 644 /untrusted-vllm-patch/dump_input_anonymization.patch /vllm-workspace/dump_input_anonymization.patch
              if [ $(sha256sum /vllm-workspace/dump_input_anonymization.patch | cut -d ' ' -f 1) != '9dad6bdaf38d151e8ec49011739f1ce467b61bf7be61e108c72cffa0b21df125' ]; then echo dump_input_anonymization.patch hash mismatch: $(sha256sum /vllm-workspace/dump_input_anonymization.patch | cut -d ' ' -f 1); exit 1; fi
              patch --batch --fuzz=0 -p1 -d /usr/local/lib/python3.12/dist-packages < /vllm-workspace/dump_input_anonymization.patch
              echo "Installing slot_mapping_block_table_bounds.patch"
              install -D -m 644 /untrusted-vllm-patch/slot_mapping_block_table_bounds.patch /vllm-workspace/slot_mapping_block_table_bounds.patch
              if [ $(sha256sum /vllm-workspace/slot_mapping_block_table_bounds.patch | cut -d ' ' -f 1) != 'e09dac3cdd56b1ee5c47b64563cdf0fb0b6644fdb83998e181752bb238b17b89' ]; then echo slot_mapping_block_table_bounds.patch hash mismatch: $(sha256sum /vllm-workspace/slot_mapping_block_table_bounds.patch | cut -d ' ' -f 1); exit 1; fi
              patch --batch --fuzz=0 -p1 -d /usr/local/lib/python3.12/dist-packages < /vllm-workspace/slot_mapping_block_table_bounds.patch
              echo "Installing transcriptions_stream_usage.patch"
              install -D -m 644 /untrusted-vllm-patch/transcriptions_stream_usage.patch /vllm-workspace/transcriptions_stream_usage.patch
              if [ $(sha256sum /vllm-workspace/transcriptions_stream_usage.patch | cut -d ' ' -f 1) != '0466d6a1120b044faf4c4e2374742d02d4511ab932effaf7943d442e0889de29' ]; then echo transcriptions_stream_usage.patch hash mismatch: $(sha256sum /vllm-workspace/transcriptions_stream_usage.patch | cut -d ' ' -f 1); exit 1; fi
              patch --batch --fuzz=0 -p1 -d /usr/local/lib/python3.12/dist-packages < /vllm-workspace/transcriptions_stream_usage.patch
              # --no-build-isolation builds without a venv using setuptools.
              # --offline verifies the declared dependencies are present without using network.
              uv pip install --system --no-build-isolation --offline /vllm-workspace/privatemode-stat-logger
              # Each model gets a separate UID for independent bootstrap and restarts.
              vllm_uid=10001
              python3 -I -S /vllm-workspace/restrict-vllm-network.py "$vllm_uid"
              exec env HOME=/vllm-workspace setpriv --reuid="$vllm_uid" --regid="$vllm_uid" --clear-groups \
                --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
                vllm serve "$@"
            - _
          args:
            - '/mnt/modelweights-deepseek-ocr-2-0'
            - '--host=127.0.0.1'
            - '--port=8000'
            - '--enable-prompt-tokens-details'
            - '--allowed-media-domains=/'
            - '--mm-hasher-algorithm=sha256'
            - '--gpu-memory-utilization=0.1'
            - '--kv-cache-memory-bytes=67.81g'
            - '--max-num-seqs=128'
            - '--max-model-len=8192'
            - '--logits-processors'
            - 'deepseek_logits_processor:NGramPerReqLogitsProcessor'
            - '--no-enable-prefix-caching'
            - '--mm-processor-cache-gb'
            - '0'
            - '--override-generation-config'
            - '{"temperature": 0, "skip_special_tokens": false}'
            - '--otlp-traces-endpoint=grpc://127.0.0.1:4317'
            - '--served-model-name'
            - 'deepseek-ocr-2'
          volumeMounts:
            - name: mount-dir
              mountPath: /mnt
              mountPropagation: HostToContainer
            - name: workload-start-marker
              mountPath: '/var/run/workload-marker'
            - name: vllm-pylock
              mountPath: /untrusted-pylock
              readOnly: true
            - name: vllm-patch
              mountPath: /untrusted-vllm-patch
              readOnly: true
          resources:
            requests:
              cpu: "3"
              memory: 64Gi
            limits:
              cpu: "3"
              memory: 64Gi
              "nvidia.com/GH100_H100_PCIE": 1
        - name: inference-proxy-deepseek-ocr-2-0
          image: ghcr.io/edgelesssys/privatemode/inference-proxy:v1.60.0@sha256:c4ac948458ad31e3ecbfa19042afd3f787b913d4783849e7adcb3b5dd2f14327
          ports:
            - containerPort: 8085
            - containerPort: 8185
          args:
            - '--adapter-type=openai,anthropic'
            - '--workload-address=127.0.0.1'
            - '--listen-port=8085'
            - '--metrics-port=8185'
            - '--stats-feed-port=8285'
            - '--workload-port=8000'
            - '--workload-model=deepseek-ocr-2'
            - '--workload-ready=http://127.0.0.1:8000/v1/models'
            - '--workload-reachability-url=http://127.0.0.1:8000/v1/models'
            - '--workload-start-marker=/var/run/workload-marker/deepseek-ocr-2-0'
            - '--workload-metrics=http://127.0.0.1:8000/metrics'
            - '--secret-svc-address=secret-service-internal.continuum-551e7c.svc.cluster.local'
            - '--etcd-member-cert=/contrast/tls-config/certChain.pem'
            - '--etcd-member-key=/contrast/tls-config/key.pem'
            - '--etcd-ca=/contrast/tls-config/mesh-ca.pem'
            - '--identity-cert-path=/var/run/secrets/identity/tls.crt'
            - '--identity-key-path=/var/run/secrets/identity/tls.key'
            - '--identity-ca-path=/var/run/secrets/identity/ca.crt'
            - '--workload-tasks=generate,vision'
            - '--usage-collector-endpoint=usage-collector.continuum-551e7c.svc.cluster.local:3000'
            - '--otlp-traces-endpoint=continuum-infra-monitoring-alloy.continuum-infra.svc.cluster.local:4317'
            - '--trace-listen-port=4317'
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8185
              scheme: HTTP
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 8185
              scheme: HTTP
            periodSeconds: 5
          volumeMounts:
            - name: inference-proxy-deepseek-ocr-2-0-identity
              mountPath: /var/run/secrets/identity
              readOnly: true
            - name: continuum-run
              mountPath: /var/run/continuum
            - name: workload-start-marker
              mountPath: '/var/run/workload-marker'
              readOnly: true
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: workload-deepseek-ocr-2
        - maxSkew: 1
          topologyKey: privatemode.edgeless.systems/datacenter
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: workload-deepseek-ocr-2
      volumes:
        - name: privatemode-identity-ca-cert
          secret:
            secretName: privatemode-identity-ca-secret
            items:
              - key: ca.crt
                path: ca.crt
        - emptyDir:
            medium: Memory
          name: mount-dir
        - emptyDir:
            medium: Memory
          name: continuum-run
        - emptyDir:
            medium: Memory
          name: workload-start-marker
        - name: vllm-pylock
          configMap:
            name: vllm-pylock
        - name: vllm-patch
          configMap:
            name: vllm-patch
        - name: inference-proxy-deepseek-ocr-2-0-identity
          secret:
            secretName: inference-proxy-deepseek-ocr-2-0-identity-secret
        - name: modelweights-deepseek-ocr-2-0
          persistentVolumeClaim:
            claimName: deepseek-ocr-2
