apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: secret-service
  namespace: continuum-49042b
  labels:
    app.kubernetes.io/instance: '49042b'
spec:
  replicas: 3
  serviceName: secret-service-headless
  selector:
    matchLabels:
      app: secret-service
  template:
    metadata:
      labels:
        app: secret-service
        app.kubernetes.io/instance: '49042b'
        privatemode.edgeless.systems/environment: 'production'
        privatemode.edgeless.systems/delete-when: coordinator-recovered
    spec:
      runtimeClassName: contrast-cc
      containers:
        - name: secret-service
          image: 'ghcr.io/edgelesssys/privatemode/secret-service:v1.52.0@sha256:dadbb0fce8433e157786439b7f87c6bf2aab0fee9ffb853b12a89f7dea175841'
          resources:
            requests:
              memory: 2Gi
            limits:
              memory: 2Gi
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec /bin/secret-service \
                --k8s-namespace=continuum-49042b \
                $([ "${HOSTNAME##*-}" = "0" ] && echo "--may-bootstrap") \
                --etcd-server-cert=/contrast/tls-config/certChain.pem \
                --etcd-server-key=/contrast/tls-config/key.pem \
                --etcd-ca=/contrast/tls-config/mesh-ca.pem
          ports:
            - containerPort: 3000
            - containerPort: 3001
            - containerPort: 9000
            - containerPort: 2379
            - containerPort: 2380
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 240
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-deepseek-ocr-2
  namespace: continuum-49042b
  labels:
    app: workload-deepseek-ocr-2
    app.kubernetes.io/instance: '49042b'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workload-deepseek-ocr-2
  template:
    metadata:
      labels:
        app: workload-deepseek-ocr-2
        app.kubernetes.io/instance: '49042b'
        privatemode.edgeless.systems/environment: 'production'
        privatemode.edgeless.systems/delete-when: coordinator-recovered
        privatemode.edgeless.systems/workload: ""
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/scheme: "http"
    spec:
      serviceAccountName: workload-deepseek-ocr-2-sa
      runtimeClassName: contrast-cc-metal-qemu-snp-gpu
      initContainers:
        - name: attestation-agent
          volumeMounts:
            - name: privatemode-identity-ca-cert
              mountPath: /var/run/secrets/identity
              readOnly: true
            - name: continuum-run
              mountPath: /var/run/continuum
            - mountPath: /contrast
              name: contrast-secrets
          image: ghcr.io/edgelesssys/privatemode/attestation-agent:v1.52.0@sha256:5d2e158bebaf8d93a9019ac377a9482ccdee015fd8ab12ee0fdf6261098af763
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
          args:
            - --identity-ca-path=/var/run/secrets/identity/ca.crt
            - --gpu-driver-versions=595.71.05
            - --gpu-vbios-versions=96.00.88.00.11,96.00.74.00.11,96.00.9F.00.04,96.00.74.00.1C
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - SYS_ADMIN
        - name: disk-mounter-deepseek-ocr-2-0
          image: ghcr.io/edgelesssys/privatemode/disk-mounter:v1.52.0@sha256:0ddd65f78b642d129be83cbabc377c368018b81b35217205fb3b6a902bb3eaf0
          args:
            - 'deepseek-ocr-2'
            - '0'
            - '173c5941da5e2d0b625c479e228151a2129bcc5af2bfc89e03ae475c1d047f83'
          restartPolicy: Always
          securityContext:
            privileged: true
          volumeMounts:
            - name: mount-dir
              mountPath: /mnt
              mountPropagation: Bidirectional
          volumeDevices:
            - name: modelweights-deepseek-ocr-2-0
              devicePath: /dev/modelweights-deepseek-ocr-2-0
      containers:
        - name: workload-deepseek-ocr-2-0
          image: docker.io/vllm/vllm-openai:v0.27.1@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
          readinessProbe:
            httpGet:
              path: /workload-readyz
              port: 8185
              scheme: HTTP
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /workload-livez
              port: 8185
              scheme: HTTP
            failureThreshold: 3
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /workload-livez
              port: 8185
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 1
            failureThreshold: 3600
          env:
            - name: VLLM_HOST_IP
              value: '127.0.0.1'
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: VLLM_MAX_AUDIO_CLIP_FILESIZE_MB
              value: "50"
            - name: VLLM_MAX_AUDIO_DECODE_DURATION_S
              value: "3600"
            - name: VLLM_MAX_N_SEQUENCES
              value: "8"
            - name: VLLM_ENGINE_READY_TIMEOUT_S
              value: "2400"
            - name: VLLM_MEDIA_URL_ALLOW_REDIRECTS
              value: "0"
            - name: VLLM_MM_HASHER_ALGORITHM
              value: "sha256"
            - name: PYTHONPATH
              value: /vllm-workspace
            - name: OTEL_SERVICE_NAME
              value: 'vllm-deepseek-ocr-2'
            - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
              value: "true"
            - name: PYTORCH_ALLOC_CONF
              value: "expandable_segments:True"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
          command:
            - /bin/bash
            - -ec
            - |
              echo "Installing deepseek_logits_processor.py"
              cp /untrusted-vllm-patch/deepseek_logits_processor.py /vllm-workspace/deepseek_logits_processor.py
              if [ $(sha256sum /vllm-workspace/deepseek_logits_processor.py | cut -d ' ' -f 1) != '628ca252446e1fc3ce0a45a66047d105ef3044688d75a4db385054b2e39ea7a0' ]; then echo deepseek_logits_processor.py hash mismatch: $(sha256sum /vllm-workspace/deepseek_logits_processor.py | cut -d ' ' -f 1); exit 1; fi
              echo "Installing stop_token_ids_validation.patch"
              cp /untrusted-vllm-patch/stop_token_ids_validation.patch /vllm-workspace/stop_token_ids_validation.patch
              if [ $(sha256sum /vllm-workspace/stop_token_ids_validation.patch | cut -d ' ' -f 1) != '944159cc045f4a5722fbbccde2879d92b4e3e60320e2efecf9b1f3a05b9fe564' ]; then echo stop_token_ids_validation.patch hash mismatch: $(sha256sum /vllm-workspace/stop_token_ids_validation.patch | cut -d ' ' -f 1); exit 1; fi
              patch --batch --fuzz=0 -p1 -d /usr/local/lib/python3.12/dist-packages < /vllm-workspace/stop_token_ids_validation.patch
              echo "Installing skip_special_tokens.patch"
              cp /untrusted-vllm-patch/skip_special_tokens.patch /vllm-workspace/skip_special_tokens.patch
              if [ $(sha256sum /vllm-workspace/skip_special_tokens.patch | cut -d ' ' -f 1) != 'e4d9105d8c5f9c28ea7b4e71aeef2ac458af36e2719a5ec6e39aa5557dd27885' ]; then echo skip_special_tokens.patch hash mismatch: $(sha256sum /vllm-workspace/skip_special_tokens.patch | cut -d ' ' -f 1); exit 1; fi
              patch --batch --fuzz=0 -p1 -d /usr/local/lib/python3.12/dist-packages < /vllm-workspace/skip_special_tokens.patch
              exec vllm serve "$@"
            - _
          args:
            - '/mnt/modelweights-deepseek-ocr-2-0'
            - '--host=127.0.0.1'
            - '--port=8000'
            - '--enable-prompt-tokens-details'
            - '--gpu-memory-utilization=0.1'
            - '--kv-cache-memory-bytes=67.81g'
            - '--max-num-seqs=128'
            - '--max-model-len=8192'
            - '--logits-processors'
            - 'deepseek_logits_processor:NGramPerReqLogitsProcessor'
            - '--no-enable-prefix-caching'
            - '--trust-remote-code'
            - '--mm-processor-cache-gb'
            - '0'
            - '--override-generation-config'
            - '{"temperature": 0, "skip_special_tokens": false}'
            - '--otlp-traces-endpoint=grpc://continuum-infra-monitoring-alloy.continuum-infra.svc.cluster.local:4317'
            - '--served-model-name'
            - 'deepseek-ocr-2'
          volumeMounts:
            - name: mount-dir
              mountPath: /mnt
              mountPropagation: HostToContainer
            - name: vllm-pylock
              mountPath: /untrusted-pylock
              readOnly: true
            - name: vllm-patch
              mountPath: /untrusted-vllm-patch
              readOnly: true
          resources:
            requests:
              cpu: "3"
              memory: 64Gi
            limits:
              cpu: "3"
              memory: 64Gi
              "nvidia.com/GH100_H100_PCIE": 1
        - name: inference-proxy-deepseek-ocr-2-0
          image: ghcr.io/edgelesssys/privatemode/inference-proxy:v1.52.0@sha256:d4f08a98e23fd7dce65933ce1dbf98f6ed1615bd6e9c0af6ce083d701f23f72b
          ports:
            - containerPort: 8085
            - containerPort: 8185
          args:
            - '--adapter-type=openai,anthropic'
            - '--workload-address=127.0.0.1'
            - '--listen-port=8085'
            - '--metrics-port=8185'
            - '--workload-port=8000'
            - '--workload-model=deepseek-ocr-2'
            - '--workload-ready=http://127.0.0.1:8000/v1/models'
            - '--workload-metrics=http://127.0.0.1:8000/metrics'
            - '--secret-svc-address=secret-service-internal.continuum-49042b.svc.cluster.local'
            - '--etcd-member-cert=/contrast/tls-config/certChain.pem'
            - '--etcd-member-key=/contrast/tls-config/key.pem'
            - '--etcd-ca=/contrast/tls-config/mesh-ca.pem'
            - '--identity-cert-path=/var/run/secrets/identity/tls.crt'
            - '--identity-key-path=/var/run/secrets/identity/tls.key'
            - '--identity-ca-path=/var/run/secrets/identity/ca.crt'
            - '--workload-tasks=generate,vision'
            - '--usage-collector-endpoint=usage-collector.continuum-49042b.svc.cluster.local:3000'
            - '--otlp-traces-endpoint=continuum-infra-monitoring-alloy.continuum-infra.svc.cluster.local:4317'
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8185
              scheme: HTTP
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 8185
              scheme: HTTP
            periodSeconds: 5
          volumeMounts:
            - name: inference-proxy-deepseek-ocr-2-0-identity
              mountPath: /var/run/secrets/identity
              readOnly: true
            - name: continuum-run
              mountPath: /var/run/continuum
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: workload-deepseek-ocr-2
      volumes:
        - name: privatemode-identity-ca-cert
          secret:
            secretName: privatemode-identity-ca-secret
            items:
              - key: ca.crt
                path: ca.crt
        - emptyDir:
            medium: Memory
          name: mount-dir
        - emptyDir:
            medium: Memory
          name: continuum-run
        - name: vllm-pylock
          configMap:
            name: vllm-pylock
        - name: vllm-patch
          configMap:
            name: vllm-patch
        - name: inference-proxy-deepseek-ocr-2-0-identity
          secret:
            secretName: inference-proxy-deepseek-ocr-2-0-identity-secret
        - name: modelweights-deepseek-ocr-2-0
          persistentVolumeClaim:
            claimName: deepseek-ocr-2
