apiVersion: apps/v1
kind: Deployment
metadata:
  name: unstructured-api
  namespace: continuum-551e7c
  labels:
    app: unstructured-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: unstructured-api
  template:
    metadata:
      labels:
        app: unstructured-api
        app.kubernetes.io/instance: '551e7c'
        privatemode.edgeless.systems/environment: 'production'
        privatemode.edgeless.systems/delete-when: coordinator-recovered
        privatemode.edgeless.systems/workload: ""
    spec:
      runtimeClassName: contrast-cc
      containers:
        - name: workload-unstructured-api
          image: 'quay.io/unstructured-io/unstructured-api:0.1.16@sha256:fcd5230db2fbdf79ad8faeec8b6fff3cebf4cf30ccd79494bdba641bd62b2961'
          env:
            - name: HOST
              value: '127.0.0.1'
            - name: WORKERS
              value: "4"
          command:
            - /bin/sh
            - -ec
            - |
              # Publish a fresh token for the inference-proxy restart detection.
              cat /proc/sys/kernel/random/uuid > '/var/run/workload-marker/unstructured-api.tmp'
              mv '/var/run/workload-marker/unstructured-api.tmp' '/var/run/workload-marker/unstructured-api'
              test -f logger_config.yaml
              cp /untrusted/logger_config.yaml .
              if [ $(sha256sum logger_config.yaml | cut -d ' ' -f 1) != '62b5acd1bff3662a27d27f4d263273447f596f2244bd35e92a450eb2247d79dd' ]; then
                echo "logger config hash mismatch: $(sha256sum logger_config.yaml | cut -d ' ' -f 1)"
                exit 1
              fi
              exec scripts/app-start.sh
          resources:
            requests:
              cpu: "3"
              memory: "60Gi"
            limits:
              cpu: "3"
              memory: "60Gi"
          volumeMounts:
            - name: unstructured-api-logging-config
              mountPath: /untrusted
              readOnly: true
            - name: workload-start-marker
              mountPath: '/var/run/workload-marker'
          readinessProbe:
            httpGet:
              path: /workload-readyz
              port: 8185
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /workload-livez
              port: 8185
              scheme: HTTP
            failureThreshold: 12
            periodSeconds: 5
            timeoutSeconds: 3
        - name: inference-proxy-unstructured-api
          image: ghcr.io/edgelesssys/privatemode/inference-proxy:v1.60.0@sha256:c4ac948458ad31e3ecbfa19042afd3f787b913d4783849e7adcb3b5dd2f14327
          ports:
            - containerPort: 8085
          args:
            - --adapter-type=unstructured
            - --workload-address=127.0.0.1
            - --workload-port=8000
            - --workload-ready=http://127.0.0.1:8000/healthcheck
            - --workload-reachability-url=http://127.0.0.1:8000/healthcheck
            - --workload-start-marker=/var/run/workload-marker/unstructured-api
            - --workload-tasks=unstructured
            - --secret-svc-address=secret-service-internal.continuum-551e7c.svc.cluster.local
            - '--etcd-member-cert=/contrast/tls-config/certChain.pem'
            - '--etcd-member-key=/contrast/tls-config/key.pem'
            - '--etcd-ca=/contrast/tls-config/mesh-ca.pem'
            - '--identity-cert-path=/var/run/secrets/identity/tls.crt'
            - '--identity-key-path=/var/run/secrets/identity/tls.key'
            - '--identity-ca-path=/var/run/secrets/identity/ca.crt'
            - '--usage-collector-endpoint=usage-collector.continuum-551e7c.svc.cluster.local:3000'
          volumeMounts:
            - name: unstructured-api-identity
              mountPath: /var/run/secrets/identity
              readOnly: true
            - name: workload-start-marker
              mountPath: '/var/run/workload-marker'
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8185
              scheme: HTTP
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 8185
              scheme: HTTP
            periodSeconds: 5
      volumes:
        - name: unstructured-api-identity
          secret:
            secretName: unstructured-api-identity-secret
        - name: unstructured-api-logging-config
          configMap:
            name: unstructured-api-logging-config
        - emptyDir:
            medium: Memory
          name: workload-start-marker
