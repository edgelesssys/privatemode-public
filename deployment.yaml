apiVersion: apps/v1
kind: Deployment
metadata:
  name: unstructured-api
  namespace: continuum-62689e
  labels:
    app: unstructured-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: unstructured-api
  template:
    metadata:
      labels:
        app: unstructured-api
        app.kubernetes.io/instance: '62689e'
        privatemode.edgeless.systems/environment: 'production'
        privatemode.edgeless.systems/delete-when: coordinator-recovered
        privatemode.edgeless.systems/workload: ""
    spec:
      runtimeClassName: contrast-cc
      containers:
        - name: workload-unstructured-api
          image: 'quay.io/unstructured-io/unstructured-api:0.1.8@sha256:cd18ed5ac5e0284f4d7647774e63863190b0bad4b765a049cfc91c643c55396c'
          env:
            - name: HOST
              value: '127.0.0.1'
            - name: WORKERS
              value: "4"
          command:
            - /bin/sh
            - -ec
            - |
              test -f logger_config.yaml
              cp /untrusted/logger_config.yaml .
              if [ $(sha256sum logger_config.yaml | cut -d ' ' -f 1) != '62b5acd1bff3662a27d27f4d263273447f596f2244bd35e92a450eb2247d79dd' ]; then
                echo "logger config hash mismatch: $(sha256sum logger_config.yaml | cut -d ' ' -f 1)"
                exit 1
              fi
              exec scripts/app-start.sh
          resources:
            requests:
              cpu: "3"
              memory: "60Gi"
            limits:
              cpu: "3"
              memory: "60Gi"
          volumeMounts:
            - name: unstructured-api-logging-config
              mountPath: /untrusted
              readOnly: true
          livenessProbe:
            httpGet:
              path: /workload-livez
              port: 8185
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 1
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /workload-readyz
              port: 8185
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 5
        - name: inference-proxy-unstructured-api
          image: ghcr.io/edgelesssys/privatemode/inference-proxy:v1.49.0@sha256:8867922ed7d4002f5309f9a037307d1fd5309acecdbf433ce223f33a1ca7cd27
          ports:
            - containerPort: 8085
          args:
            - --adapter-type=unstructured
            - --workload-address=127.0.0.1
            - --workload-port=8000
            - --workload-live=http://127.0.0.1:8000/healthcheck
            - --workload-ready=http://127.0.0.1:8000/healthcheck
            - --secret-svc-address=secret-service-internal.continuum-62689e.svc.cluster.local
            - '--etcd-member-cert=/contrast/tls-config/certChain.pem'
            - '--etcd-member-key=/contrast/tls-config/key.pem'
            - '--etcd-ca=/contrast/tls-config/mesh-ca.pem'
            - '--identity-cert-path=/var/run/secrets/identity/tls.crt'
            - '--identity-key-path=/var/run/secrets/identity/tls.key'
            - '--identity-ca-path=/var/run/secrets/identity/ca.crt'
            - '--usage-collector-endpoint=usage-collector.continuum-62689e.svc.cluster.local:3000'
          volumeMounts:
            - name: unstructured-api-identity
              mountPath: /var/run/secrets/identity
              readOnly: true
          livenessProbe:
            httpGet:
              path: /livez
              port: 8185
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 1
            failureThreshold: 2
      volumes:
        - name: unstructured-api-identity
          secret:
            secretName: unstructured-api-identity-secret
        - name: unstructured-api-logging-config
          configMap:
            name: unstructured-api-logging-config
