apiVersion: apps/v1
kind: Deployment
metadata:
  name: unstructured-api
  namespace: continuum-49042b
  labels:
    app: unstructured-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: unstructured-api
  template:
    metadata:
      labels:
        app: unstructured-api
        app.kubernetes.io/instance: '49042b'
        privatemode.edgeless.systems/environment: 'production'
        privatemode.edgeless.systems/delete-when: coordinator-recovered
        privatemode.edgeless.systems/workload: ""
    spec:
      runtimeClassName: contrast-cc
      containers:
        - name: workload-unstructured-api
          image: 'quay.io/unstructured-io/unstructured-api:0.1.10@sha256:0df934a22e4e893cf15e7aeaf35c463ecc75937758a83099aefdc13041619a1d'
          env:
            - name: HOST
              value: '127.0.0.1'
            - name: WORKERS
              value: "4"
          command:
            - /bin/sh
            - -ec
            - |
              test -f logger_config.yaml
              cp /untrusted/logger_config.yaml .
              if [ $(sha256sum logger_config.yaml | cut -d ' ' -f 1) != '62b5acd1bff3662a27d27f4d263273447f596f2244bd35e92a450eb2247d79dd' ]; then
                echo "logger config hash mismatch: $(sha256sum logger_config.yaml | cut -d ' ' -f 1)"
                exit 1
              fi
              exec scripts/app-start.sh
          resources:
            requests:
              cpu: "3"
              memory: "60Gi"
            limits:
              cpu: "3"
              memory: "60Gi"
          volumeMounts:
            - name: unstructured-api-logging-config
              mountPath: /untrusted
              readOnly: true
          startupProbe:
            httpGet:
              path: /workload-livez
              port: 8185
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 1
            failureThreshold: 600
          livenessProbe:
            httpGet:
              path: /workload-livez
              port: 8185
              scheme: HTTP
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /workload-readyz
              port: 8185
              scheme: HTTP
            periodSeconds: 5
        - name: inference-proxy-unstructured-api
          image: ghcr.io/edgelesssys/privatemode/inference-proxy:v1.52.0@sha256:d4f08a98e23fd7dce65933ce1dbf98f6ed1615bd6e9c0af6ce083d701f23f72b
          ports:
            - containerPort: 8085
          args:
            - --adapter-type=unstructured
            - --workload-address=127.0.0.1
            - --workload-port=8000
            - --workload-ready=http://127.0.0.1:8000/healthcheck
            - --workload-tasks=unstructured
            - --secret-svc-address=secret-service-internal.continuum-49042b.svc.cluster.local
            - '--etcd-member-cert=/contrast/tls-config/certChain.pem'
            - '--etcd-member-key=/contrast/tls-config/key.pem'
            - '--etcd-ca=/contrast/tls-config/mesh-ca.pem'
            - '--identity-cert-path=/var/run/secrets/identity/tls.crt'
            - '--identity-key-path=/var/run/secrets/identity/tls.key'
            - '--identity-ca-path=/var/run/secrets/identity/ca.crt'
            - '--usage-collector-endpoint=usage-collector.continuum-49042b.svc.cluster.local:3000'
          volumeMounts:
            - name: unstructured-api-identity
              mountPath: /var/run/secrets/identity
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8185
              scheme: HTTP
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 8185
              scheme: HTTP
