          name: mount-dir
        - emptyDir:
            medium: Memory
          name: continuum-run
        - name: vllm-patch
          configMap:
            name: vllm-patch
        - name: inference-proxy-gemma-4-31b-0-identity
          secret:
            secretName: inference-proxy-gemma-4-31b-0-identity-secret
