apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: secret-service
  namespace: continuum-41a047
  labels:
    app.kubernetes.io/instance: '41a047'
spec:
  replicas: 3
  serviceName: secret-service-headless
  selector:
    matchLabels:
      app: secret-service
  template:
    metadata:
      labels:
        app: secret-service
        app.kubernetes.io/instance: '41a047'
    spec:
      runtimeClassName: contrast-cc
      containers:
        - name: secret-service
          image: 'ghcr.io/edgelesssys/privatemode/secret-service:v1.44.0@sha256:343e4c08a1ce33b29bf8a3ca3417f24cc483d2b15c12d659682b993172b57603'
          resources:
            requests:
              memory: 2Gi
            limits:
              memory: 2Gi
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec /bin/secret-service \
                --k8s-namespace=continuum-41a047 \
                $([ "${HOSTNAME##*-}" = "0" ] && echo "--may-bootstrap") \
                --etcd-server-cert=/contrast/tls-config/certChain.pem \
                --etcd-server-key=/contrast/tls-config/key.pem \
                --etcd-ca=/contrast/tls-config/mesh-ca.pem
          ports:
            - containerPort: 3000
            - containerPort: 3001
            - containerPort: 9000
            - containerPort: 2379
            - containerPort: 2380
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 240
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-gemma-4-31b
  namespace: continuum-41a047
  labels:
    app: workload-gemma-4-31b
    app.kubernetes.io/instance: '41a047'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workload-gemma-4-31b
  template:
    metadata:
      labels:
        app: workload-gemma-4-31b
        app.kubernetes.io/instance: '41a047'
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/scheme: "http"
    spec:
      serviceAccountName: workload-gemma-4-31b-sa
      runtimeClassName: contrast-cc-metal-qemu-tdx-gpu
      initContainers:
        - name: attestation-agent
          volumeMounts:
            - name: privatemode-identity-ca-cert
              mountPath: /etc/ssl/certs
              readOnly: true
            - name: continuum-run
              mountPath: /var/run/continuum
            - mountPath: /contrast
              name: contrast-secrets
          image: ghcr.io/edgelesssys/privatemode/attestation-agent:v1.44.0@sha256:8b97c2c2a1de48b1486cde59e74491ba2bc1fde5ca72adb1790191b5db7a8e46
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
          args:
            - --gpu-driver-versions=595.71.05
            - --gpu-vbios-versions=97.00.d9.00.35
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - SYS_ADMIN
        - name: disk-mounter-gemma-4-31b-0
          image: ghcr.io/edgelesssys/privatemode/disk-mounter:v1.44.0@sha256:cb6641e37e81487fa765fef24af97ce1c51467872148c3e441cdd03e71d054fb
          args:
            - 'gemma-4-31b'
            - '0'
            - 'e60b3dbcd95c026297db0ec524c8578048d142653c2d68e20c2ec1c45f74ee6c'
          restartPolicy: Always
          securityContext:
            privileged: true
          volumeMounts:
            - name: mount-dir
              mountPath: /mnt
              mountPropagation: Bidirectional
          volumeDevices:
            - name: modelweights-gemma-4-31b-0
              devicePath: /dev/modelweights-gemma-4-31b-0
      containers:
        - name: workload-gemma-4-31b-0
          image: docker.io/vllm/vllm-openai:v0.21.0@sha256:a230095847e93bd4df9888b33dab956fa9504537b828a23657d2b26fed57b5c9
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 5
          env:
            - name: VLLM_MAX_AUDIO_CLIP_FILESIZE_MB
              value: "50"
            - name: OTEL_SERVICE_NAME
              value: 'vllm-gemma-4-31b'
            - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
              value: "true"
            - name: PYTORCH_ALLOC_CONF
              value: "expandable_segments:True"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
          command:
            - /bin/bash
            - -ec
            - |
              cp /untrusted-vllm-patch/anthropic.patch /vllm-workspace/anthropic.patch
              if [ $(sha256sum /vllm-workspace/anthropic.patch | cut -d ' ' -f 1) != 'cf00a63ccce9f46f9912b5ed4d4c616428eebed0eb415a25d4def050bc64274b' ]; then echo anthropic.patch hash mismatch: $(sha256sum /vllm-workspace/anthropic.patch | cut -d ' ' -f 1); exit 1; fi
              patch --batch --fuzz=0 -p1 -d /usr/local/lib/python3.12/dist-packages < /vllm-workspace/anthropic.patch
              cp /untrusted-vllm-patch/anthropic_system_messages.patch /vllm-workspace/anthropic_system_messages.patch
              if [ $(sha256sum /vllm-workspace/anthropic_system_messages.patch | cut -d ' ' -f 1) != '9efad44303961fe4a17da51b934a1fbff09060366838bd512f4867cfed5c7cd6' ]; then echo anthropic_system_messages.patch hash mismatch: $(sha256sum /vllm-workspace/anthropic_system_messages.patch | cut -d ' ' -f 1); exit 1; fi
              patch --batch --fuzz=0 -p1 -d /usr/local/lib/python3.12/dist-packages < /vllm-workspace/anthropic_system_messages.patch
              exec vllm serve "$@"
            - _
          args:
            - '/mnt/modelweights-gemma-4-31b-0'
            - '--host=0.0.0.0'
            - '--port=8000'
            - '--enable-prompt-tokens-details'
            - '--gpu-memory-utilization=0.1'
            - '--kv-cache-memory-bytes=132g'
            - '--max-num-seqs=128'
            - '--max-model-len=262144'
            - '--enable-auto-tool-choice'
            - '--tool-call-parser'
            - 'gemma4'
            - '--reasoning-parser'
            - 'gemma4'
            - '--structured-outputs-config={"backend": "xgrammar", "disable_any_whitespace": true}'
            - '--prefix-caching-hash-algo=sha256'
            - '--default-chat-template-kwargs'
            - '{"enable_thinking": true}'
            - '--override-generation-config'
            - '{"repetition_penalty": 1.2}'
            - '--otlp-traces-endpoint=grpc://continuum-infra-alloy.continuum-infra.svc.cluster.local:4317'
            - '--served-model-name'
            - 'gemma-4-31b'
          volumeMounts:
            - name: mount-dir
              mountPath: /mnt
              mountPropagation: HostToContainer
            - name: vllm-patch
              mountPath: /untrusted-vllm-patch
              readOnly: true
          resources:
            requests:
              cpu: "7"
              memory: 80Gi
            limits:
              cpu: "7"
              memory: 80Gi
              "nvidia.com/GB100_B200": 1
        - name: inference-proxy-gemma-4-31b-0
          image: ghcr.io/edgelesssys/privatemode/inference-proxy:v1.44.0@sha256:a546575ed16bf74d335999fe37597efbebb99a0bb64668c179cc62c332b83f19
          ports:
            - containerPort: 8085
            - containerPort: 8185
          args:
            - '--adapter-type=openai,anthropic'
            - '--workload-address=127.0.0.1'
            - '--listen-port=8085'
            - '--metrics-port=8185'
            - '--workload-port=8000'
            - '--secret-svc-address=secret-service-internal.continuum-41a047.svc.cluster.local'
            - '--etcd-member-cert=/contrast/tls-config/certChain.pem'
            - '--etcd-member-key=/contrast/tls-config/key.pem'
            - '--etcd-ca=/contrast/tls-config/mesh-ca.pem'
            - '--identity-cert-path=/var/run/secrets/identity/tls.crt'
            - '--identity-key-path=/var/run/secrets/identity/tls.key'
            - '--identity-ca-path=/var/run/secrets/identity/ca.crt'
            - '--workload-tasks=generate,tool_calling,vision'
            - '--usage-collector-endpoint=usage-collector.continuum-41a047.svc.cluster.local:3000'
            - '--otlp-traces-endpoint=continuum-infra-alloy.continuum-infra.svc.cluster.local:4317'
          volumeMounts:
            - name: inference-proxy-gemma-4-31b-0-identity
              mountPath: /var/run/secrets/identity
              readOnly: true
            - name: continuum-run
              mountPath: /var/run/continuum
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: workload-gemma-4-31b
      volumes:
        - name: privatemode-identity-ca-cert
          secret:
            secretName: privatemode-identity-ca-secret
            items:
              - key: ca.crt
                path: ca.crt
        - emptyDir:
            medium: Memory
          name: mount-dir
        - emptyDir:
            medium: Memory
          name: continuum-run
        - name: vllm-patch
          configMap:
            name: vllm-patch
        - name: inference-proxy-gemma-4-31b-0-identity
          secret:
            secretName: inference-proxy-gemma-4-31b-0-identity-secret
        - name: modelweights-gemma-4-31b-0
          persistentVolumeClaim:
            claimName: gemma-4-31b
