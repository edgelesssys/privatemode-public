              install -D -m 644 /untrusted-vllm-patch/transcriptions.patch /vllm-workspace/transcriptions.patch
              if [ $(sha256sum /vllm-workspace/transcriptions.patch | cut -d ' ' -f 1) != 'e0286354e2f3787cb873dc70d659cbf55420adec19852d27fb3cade6266af627' ]; then echo transcriptions.patch hash mismatch: $(sha256sum /vllm-workspace/transcriptions.patch | cut -d ' ' -f 1); exit 1; fi
              patch --batch --fuzz=0 -p1 -d /usr/local/lib/python3.12/dist-packages < /vllm-workspace/transcriptions.patch
              echo "Installing voxtral.patch"
              install -D -m 644 /untrusted-vllm-patch/voxtral.patch /vllm-workspace/voxtral.patch
              if [ $(sha256sum /vllm-workspace/voxtral.patch | cut -d ' ' -f 1) != 'dd59b2e26971e18d165fcc4463026b47b8149b796bb253646005e2fa88dc49e0' ]; then echo voxtral.patch hash mismatch: $(sha256sum /vllm-workspace/voxtral.patch | cut -d ' ' -f 1); exit 1; fi
              patch --batch --fuzz=0 -p1 -d /usr/local/lib/python3.12/dist-packages < /vllm-workspace/voxtral.patch
              echo "Installing generation_config.patch"
              install -D -m 644 /untrusted-vllm-patch/generation_config.patch /vllm-workspace/generation_config.patch
              if [ $(sha256sum /vllm-workspace/generation_config.patch | cut -d ' ' -f 1) != '22f84010fece1a64969f8dc17ecd89579c6bd876e05ba9d5cfe4da0ec7d005d2' ]; then echo generation_config.patch hash mismatch: $(sha256sum /vllm-workspace/generation_config.patch | cut -d ' ' -f 1); exit 1; fi
              patch --batch --fuzz=0 -p1 -d /usr/local/lib/python3.12/dist-packages < /vllm-workspace/generation_config.patch
              echo "Installing repetition_detection_cap.patch"
              install -D -m 644 /untrusted-vllm-patch/repetition_detection_cap.patch /vllm-workspace/repetition_detection_cap.patch
              if [ $(sha256sum /vllm-workspace/repetition_detection_cap.patch | cut -d ' ' -f 1) != '64fb3ddeb4d1591dee4773739b2bf44b622ef4388d80eee28b30a847dbf5133f' ]; then echo repetition_detection_cap.patch hash mismatch: $(sha256sum /vllm-workspace/repetition_detection_cap.patch | cut -d ' ' -f 1); exit 1; fi
              patch --batch --fuzz=0 -p1 -d /usr/local/lib/python3.12/dist-packages < /vllm-workspace/repetition_detection_cap.patch
              echo "Installing anthropic_usage_stream.patch"
              install -D -m 644 /untrusted-vllm-patch/anthropic_usage_stream.patch /vllm-workspace/anthropic_usage_stream.patch
              if [ $(sha256sum /vllm-workspace/anthropic_usage_stream.patch | cut -d ' ' -f 1) != 'acda26dc6a33351a202777987cf2cef5936cfbbb885b9b79ff36569b705d86d2' ]; then echo anthropic_usage_stream.patch hash mismatch: $(sha256sum /vllm-workspace/anthropic_usage_stream.patch | cut -d ' ' -f 1); exit 1; fi
              patch --batch --fuzz=0 -p1 -d /usr/local/lib/python3.12/dist-packages < /vllm-workspace/anthropic_usage_stream.patch
              echo "Installing dump_input_anonymization.patch"
              install -D -m 644 /untrusted-vllm-patch/dump_input_anonymization.patch /vllm-workspace/dump_input_anonymization.patch
              if [ $(sha256sum /vllm-workspace/dump_input_anonymization.patch | cut -d ' ' -f 1) != '9dad6bdaf38d151e8ec49011739f1ce467b61bf7be61e108c72cffa0b21df125' ]; then echo dump_input_anonymization.patch hash mismatch: $(sha256sum /vllm-workspace/dump_input_anonymization.patch | cut -d ' ' -f 1); exit 1; fi
              patch --batch --fuzz=0 -p1 -d /usr/local/lib/python3.12/dist-packages < /vllm-workspace/dump_input_anonymization.patch
              echo "Installing slot_mapping_block_table_bounds.patch"
              install -D -m 644 /untrusted-vllm-patch/slot_mapping_block_table_bounds.patch /vllm-workspace/slot_mapping_block_table_bounds.patch
              if [ $(sha256sum /vllm-workspace/slot_mapping_block_table_bounds.patch | cut -d ' ' -f 1) != 'e09dac3cdd56b1ee5c47b64563cdf0fb0b6644fdb83998e181752bb238b17b89' ]; then echo slot_mapping_block_table_bounds.patch hash mismatch: $(sha256sum /vllm-workspace/slot_mapping_block_table_bounds.patch | cut -d ' ' -f 1); exit 1; fi
              patch --batch --fuzz=0 -p1 -d /usr/local/lib/python3.12/dist-packages < /vllm-workspace/slot_mapping_block_table_bounds.patch
              echo "Installing transcriptions_stream_usage.patch"
              install -D -m 644 /untrusted-vllm-patch/transcriptions_stream_usage.patch /vllm-workspace/transcriptions_stream_usage.patch
              if [ $(sha256sum /vllm-workspace/transcriptions_stream_usage.patch | cut -d ' ' -f 1) != '0466d6a1120b044faf4c4e2374742d02d4511ab932effaf7943d442e0889de29' ]; then echo transcriptions_stream_usage.patch hash mismatch: $(sha256sum /vllm-workspace/transcriptions_stream_usage.patch | cut -d ' ' -f 1); exit 1; fi
              patch --batch --fuzz=0 -p1 -d /usr/local/lib/python3.12/dist-packages < /vllm-workspace/transcriptions_stream_usage.patch
              # --no-build-isolation builds without a venv using setuptools.
              # --offline verifies the declared dependencies are present without using network.
              uv pip install --system --no-build-isolation --offline /vllm-workspace/privatemode-stat-logger
