apiVersion: apps/v1
kind: Deployment
metadata:
  name: privatemode-proxy
  labels:
    helm.sh/chart: privatemode-proxy-1.59.0
    app.kubernetes.io/name: privatemode-proxy
    app.kubernetes.io/instance: continuum-application-continuum-7a3b43
    app.kubernetes.io/managed-by: Helm
  namespace: continuum-7a3b43
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: privatemode-proxy
      app.kubernetes.io/instance: continuum-application-continuum-7a3b43
  template:
    metadata:
      labels:
        app.kubernetes.io/name: privatemode-proxy
        app.kubernetes.io/instance: continuum-application-continuum-7a3b43
      annotations:
        contrast.edgeless.systems/skip-initializer: "true"
    spec:
      runtimeClassName: "contrast-cc"
      restartPolicy: Always
      initContainers:
        - args:
            - |
              apt-get update
              apt-get install -y --no-install-recommends iptables
              /usr/sbin/iptables-legacy -D INPUT -m conntrack ! --ctstate ESTABLISHED,RELATED -j DROP || [ "$?" -eq 1 ]
          command:
            - /bin/sh
            - -ec
          image: debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
          name: allow-ingress
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
      containers:
        - name: privatemode-proxy
          image: "ghcr.io/edgelesssys/privatemode/privatemode-proxy:v1.59.0@sha256:3cd4da0ee6ceee91ca84dde4e3e3f0e94e8b354d7c1d46987e4331a5c2f8bcff"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 30
            httpGet:
              path: /readyz
              port: http
              scheme: HTTPS
          readinessProbe:
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: http
              scheme: HTTPS
          args:
            - "--api-key=@/etc/apiKey/apiKey"
            - "--api-key-fallback=never"
            - "--api-endpoint=api.privatemode.ai:443"
            - "--port=8080"
            - "--cors-allowed-origins=*"
            - "--tls-cert-path=/etc/tls/tls.crt"
            - "--tls-key-path=/etc/tls/tls.key"
            - "--disable-prompt-cache=false"
            - "--prompt-cache-salt=api-key"
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: apikey
              mountPath: /etc/apiKey
              readOnly: true
          resources: {}
      volumes:
        - name: tls-certs
          secret:
            secretName: privatemode-proxy-tls
        - name: apikey
          secret:
            secretName: privatemode-api-key
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations: []
      affinity: {}
