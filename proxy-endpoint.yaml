apiVersion: apps/v1
kind: Deployment
metadata:
  name: privatemode-proxy
  labels:
    helm.sh/chart: privatemode-proxy-1.60.0
    app.kubernetes.io/name: privatemode-proxy
    app.kubernetes.io/instance: continuum-application-continuum-551e7c
    app.kubernetes.io/managed-by: Helm
  namespace: continuum-551e7c
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: privatemode-proxy
      app.kubernetes.io/instance: continuum-application-continuum-551e7c
  template:
    metadata:
      labels:
        app.kubernetes.io/name: privatemode-proxy
        app.kubernetes.io/instance: continuum-application-continuum-551e7c
        privatemode.edgeless.systems/environment: production
      annotations:
        contrast.edgeless.systems/skip-initializer: "true"
    spec:
      runtimeClassName: "contrast-cc"
      restartPolicy: Always
      initContainers:
        - args:
            - |
              apt-get update
              apt-get install -y --no-install-recommends iptables
              /usr/sbin/iptables-legacy -D INPUT -m conntrack ! --ctstate ESTABLISHED,RELATED -j DROP || [ "$?" -eq 1 ]
          command:
            - /bin/sh
            - -ec
          image: debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
          name: allow-ingress
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
      containers:
        - name: privatemode-proxy
          image: "ghcr.io/edgelesssys/privatemode/privatemode-proxy:v1.60.0@sha256:ea044948f9ee427ba8eff07a489e1105f20170e3e8c42b9800d8adaf065b24b3"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 30
            httpGet:
              path: /readyz
              port: http
              scheme: HTTPS
          readinessProbe:
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: http
              scheme: HTTPS
          args:
            - "--api-key=@/etc/apiKey/apiKey"
            - "--api-key-fallback=never"
            - "--api-endpoint=api.privatemode.ai:443"
            - "--port=8080"
            - "--cors-allowed-origins=*"
            - "--tls-cert-path=/etc/tls/tls.crt"
            - "--tls-key-path=/etc/tls/tls.key"
            - "--disable-prompt-cache=false"
            - "--prompt-cache-salt=api-key"
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: apikey
              mountPath: /etc/apiKey
              readOnly: true
          resources: {}
      volumes:
        - name: tls-certs
          secret:
            secretName: privatemode-proxy-tls
        - name: apikey
          secret:
            secretName: privatemode-api-key
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations: []
      affinity: {}
